apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-authorizations-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.ars-humano.example.com
      secretName: health-authorizations-api-tls
  rules:
    - host: api.ars-humano.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: health-authorizations-api
                port:
                  name: http
