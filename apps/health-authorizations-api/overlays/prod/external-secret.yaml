# Los secretos de producción viven en un gestor de secretos (aquí Azure Key Vault) y External Secrets
# Operator los materializa como Secret de Kubernetes. En Git solo queda la referencia, nunca el valor.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-authorizations-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: health-authorizations-api
    creationPolicy: Owner
  data:
    - secretKey: ConnectionStrings__Database
      remoteRef:
        key: health-authorizations-db-connection
    - secretKey: RabbitMq__ConnectionString
      remoteRef:
        key: health-authorizations-rabbitmq-connection
    - secretKey: Jwt__SigningKey
      remoteRef:
        key: health-authorizations-jwt-signing-key
    - secretKey: MediatR__LicenseKey
      remoteRef:
        key: mediatr-license-key
