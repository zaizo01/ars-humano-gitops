apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: health-authorizations-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: health-authorizations-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # evita bajar y subir réplicas en ráfagas cortas
