# Aplica las migraciones con la MISMA imagen que se va a desplegar (`--migrate`) y termina.
# Como hook PreSync de Argo CD, corre antes de actualizar el Deployment: si falla, el despliegue
# se detiene y las réplicas actuales siguen atendiendo con el esquema anterior.
apiVersion: batch/v1
kind: Job
metadata:
  name: health-authorizations-api-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrations
    spec:
      serviceAccountName: health-authorizations-api
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: health-authorizations-api
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: health-authorizations-api
            - secretRef:
                name: health-authorizations-api
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
