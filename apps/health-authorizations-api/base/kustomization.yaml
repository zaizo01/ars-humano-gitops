apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Manifiestos comunes a todos los entornos. Cada overlay define namespace,
# versión de imagen, réplicas, recursos y secretos.

labels:
  - pairs:
      app.kubernetes.io/name: health-authorizations-api
      app.kubernetes.io/part-of: ars-humano
    includeSelectors: true

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - migration-job.yaml

# La imagen queda con el nombre lógico "health-authorizations-api"; cada overlay fija
# repositorio y versión con `images:` (así el pipeline cambia solo la versión de un entorno).
