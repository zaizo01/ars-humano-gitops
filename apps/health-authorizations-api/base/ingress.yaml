apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-authorizations-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: api.ars-humano.local   # cada overlay reemplaza el host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: health-authorizations-api
                port:
                  name: http
